<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>古籍修复开工核验台</title><link rel="stylesheet" href="/style.css"></head><body><main><header><h1>古籍修复开工核验台</h1><p>病害、材料试片、风险闭环与开工许可</p></header><section class="panel"><h2>创建修复案卷</h2><form id="caseForm"><input name="collectionCode" placeholder="藏品标识" required><input name="title" placeholder="古籍标题" required><input name="materialProfile" placeholder="材质概况" required><input name="ownerName" placeholder="责任人" required><input name="targetDate" type="date" required><button>创建案卷</button></form><output id="caseOut"></output></section><section class="panel"><h2>案卷工作台</h2><div class="row"><input id="caseId" placeholder="输入案卷 ID"><button id="load">加载</button></div><pre id="detail">尚未加载案卷</pre><div class="grid"><form id="regionForm"><h3>登记病害</h3><input name="regionCode" placeholder="区域编号" required><input name="location" placeholder="位置" required><input name="damageType" placeholder="病害类型" required><input name="severity" placeholder="严重度" required><input name="widthMM" type="number" step="0.1" placeholder="宽(mm)" required><input name="heightMM" type="number" step="0.1" placeholder="高(mm)" required><input name="evidenceNote" placeholder="证据说明"><button>保存病害</button></form><form id="planForm"><h3>修复方案</h3><input name="materialLots" placeholder="材料批次，用逗号分隔" required><input name="procedureSteps" placeholder="工序，用逗号分隔" required><input name="regionBindings" placeholder="病害区域 ID，用逗号分隔" required><input name="constraints" placeholder="适用边界"><button>提交方案</button></form><form id="couponForm"><h3>试片验证</h3><input name="couponCode" placeholder="试片编号" required><input name="substrate" placeholder="基材" required><input name="formula" placeholder="配比" required><input name="environment" placeholder="环境条件" required><input name="observationHours" type="number" placeholder="观察小时" required><input name="colorDelta" type="number" step="0.1" placeholder="色差"><input name="phValue" type="number" step="0.1" placeholder="pH" required><input name="peelStrength" type="number" step="0.1" placeholder="剥离强度"><input name="reversibilityGrade" placeholder="可逆性等级" required><button>记录试片</button></form></div><div class="actions"><button id="assess">执行兼容性评估</button><button id="resolve">提交整改证据</button><button id="review">申请复核</button><button id="approve">批准并签发许可</button><button id="verify">验真许可</button></div><output id="message"></output></section></main><script src="/app.js"></script></body></html>
